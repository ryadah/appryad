plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android { 
    namespace 'com.ryadah.medicaldirectory'
    compileSdk 35

    defaultConfig { 
        applicationId 'com.ryadah.medicaldirectory'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '1.10' 
    }

    signingConfigs {
        release {
            def ks = System.getenv('RELEASE_KEYSTORE_FILE') ?: 'keystore/medical-directory-release.jks'
            storeFile file(ks)
            storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('RELEASE_KEY_ALIAS')
            keyPassword System.getenv('RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}


dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
